<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="904" viewBox="0 0 1424 904" role="img" aria-labelledby="title desc">
<title id="title">Spectra Scheduler — temporal forecaster and planner internals</title><desc id="desc">Past masked receiver history feeds a shared causal TCN and observation-only periodic phase evidence. A learned gate mixes periodic hypotheses and an aperiodic rate, then applies a learned rate correction to predict future capture counts. A finite-horizon dynamic program uses public receiver timing and coverage ages to select band and listening dwell. The chosen action is executed before history is updated. Model weights are frozen and no true emitter period, phase or future data enter this path.</desc>
<defs>
<marker id="data-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#2b6285" stroke-width="1.6"/></marker>
<marker id="action-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#a74c63" stroke-width="1.6"/></marker>
<marker id="truth-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#a07628" stroke-width="1.6"/></marker>
<marker id="weights-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#277b69" stroke-width="1.6"/></marker>
<style>
text {font-family:'Noto Sans','Segoe UI',Arial,sans-serif;fill:#183246;}
.data {fill:none;stroke:#2b6285;stroke-width:2.2;marker-end:url(#data-arrow);}
.action {fill:none;stroke:#a74c63;stroke-width:2.4;marker-end:url(#action-arrow);}
.truth {fill:none;stroke:#a07628;stroke-width:2.2;stroke-dasharray:6 5;marker-end:url(#truth-arrow);}
.weights {fill:none;stroke:#277b69;stroke-width:2.2;stroke-dasharray:9 4;marker-end:url(#weights-arrow);}
</style></defs>
<rect x="0" y="0" width="1424" height="904" rx="0" fill="#ffffff"/>
<text x="40" y="53" font-size="30" font-weight="700" style="fill:#183246">Temporal forecaster + frequency–time planner</text>
<text x="40" y="86" font-size="17" style="fill:#526b7d">One decision path · selected checkpoint · 1-ms experimental ticks · all bands share neural parameters</text>
<rect x="40" y="186" width="284" height="400" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="58" y="218" font-size="22" font-weight="700" style="fill:#183246">Causal memory</text>
<text x="58" y="248" font-size="17" style="fill:#526b7d">Listening mask</text>
<text x="58" y="272" font-size="17" style="fill:#526b7d">Observed counts</text>
<text x="58" y="296" font-size="17" style="fill:#526b7d">Measured power if valid</text>
<text x="58" y="320" font-size="17" style="fill:#526b7d"></text>
<text x="58" y="344" font-size="17" style="fill:#526b7d">288 ticks of past history</text>
<text x="58" y="368" font-size="17" style="fill:#526b7d">Per-band state; no IDs</text>
<text x="58" y="392" font-size="17" style="fill:#526b7d"></text>
<text x="58" y="416" font-size="17" style="fill:#526b7d">Tensor: [batch, bands,</text>
<text x="58" y="440" font-size="17" style="fill:#526b7d">3 channels, 288 ticks]</text>
<text x="58" y="569" font-size="13" style="fill:#526b7d">TimingHistory</text>
<rect x="365" y="124" width="720" height="516" rx="12" fill="#f2f8f5" stroke="#bdd7cd" stroke-width="1.3"/>
<text x="391" y="155" font-size="19" font-weight="700" style="fill:#277b69">TimingBeliefNetwork — frozen on CUDA</text>
<rect x="391" y="178" width="668" height="96" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="409" y="210" font-size="20" font-weight="700" style="fill:#183246">Observation preparation</text>
<text x="409" y="240" font-size="16" style="fill:#526b7d">Synthetic: learned power-quality weighting; replay: raw counts without that gate</text>
<text x="409" y="257" font-size="13" style="fill:#526b7d">Missing observations retain an explicit listening mask</text>
<rect x="391" y="314" width="318" height="148" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="409" y="346" font-size="19" font-weight="700" style="fill:#183246">Shared causal TCN</text>
<text x="409" y="376" font-size="15" style="fill:#526b7d">Width 32; left-padded k=3</text>
<text x="409" y="400" font-size="15" style="fill:#526b7d">Dilations 1 / 2 / 4 / 8 / 16 / 32 / 64</text>
<text x="409" y="424" font-size="15" style="fill:#526b7d">Last + pooled context, exposure / hits</text>
<rect x="739" y="314" width="320" height="148" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="757" y="346" font-size="19" font-weight="700" style="fill:#183246">Periodic phase evidence</text>
<text x="757" y="376" font-size="15" style="fill:#526b7d">Candidate periods: 2–144 ticks</text>
<text x="757" y="400" font-size="15" style="fill:#526b7d">Mask-weighted phase hits / exposure</text>
<text x="757" y="424" font-size="15" style="fill:#526b7d">Aperiodic expert: causal band rate</text>
<rect x="391" y="506" width="668" height="96" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="409" y="538" font-size="20" font-weight="700" style="fill:#183246">Learned mixture + rate correction</text>
<text x="409" y="568" font-size="16" style="fill:#526b7d">Context and phase evidence → expert weights → weighted future counts</text>
<text x="409" y="585" font-size="13" style="fill:#526b7d">No supplied emitter period / phase; no absolute band-ID embedding</text>
<rect x="1130" y="186" width="270" height="260" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="1148" y="218" font-size="18" font-weight="700" style="fill:#183246">Opportunity forecast</text>
<text x="1148" y="248" font-size="15" style="fill:#526b7d">Expected capture counts</text>
<text x="1148" y="272" font-size="15" style="fill:#526b7d">Each band × next 80 ms</text>
<text x="1148" y="296" font-size="15" style="fill:#526b7d"></text>
<text x="1148" y="320" font-size="15" style="fill:#526b7d">Tensor: [batch, bands,</text>
<text x="1148" y="344" font-size="15" style="fill:#526b7d">80 future ticks]</text>
<text x="1148" y="368" font-size="15" style="fill:#526b7d"></text>
<text x="1148" y="392" font-size="15" style="fill:#526b7d">Inferred future opportunity;</text>
<text x="1148" y="416" font-size="15" style="fill:#526b7d">not simulator truth</text>
<rect x="40" y="704" width="310" height="112" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="58" y="736" font-size="20" font-weight="700" style="fill:#183246">Public receiver state</text>
<text x="58" y="766" font-size="16" style="fill:#526b7d">Current band, retune table</text>
<text x="58" y="790" font-size="16" style="fill:#526b7d">Remaining time, observed ages</text>
<rect x="391" y="704" width="694" height="112" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="409" y="736" font-size="21" font-weight="700" style="fill:#183246">Receding-horizon dynamic program</text>
<text x="409" y="766" font-size="17" style="fill:#526b7d">Integrated expected capture; retune delays consume forecast time</text>
<text x="409" y="790" font-size="17" style="fill:#526b7d">First native action only; coverage probes use observed band ages</text>
<text x="1135" y="481" font-size="15" font-weight="700" style="fill:#526b7d">Synthetic action forecasts:</text>
<text x="1135" y="507" font-size="15" style="fill:#526b7d">hit probability, delay and ratio</text>
<text x="1135" y="538" font-size="15" style="fill:#526b7d">PDW replay returns actions;</text>
<text x="1135" y="563" font-size="15" style="fill:#526b7d">external calibration is open.</text>
<rect x="1130" y="704" width="270" height="112" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="1148" y="736" font-size="20" font-weight="700" style="fill:#183246">Receiver action</text>
<text x="1148" y="766" font-size="15" style="fill:#526b7d">Band + 1 / 10 / 50-ms dwell</text>
<text x="1148" y="790" font-size="15" style="fill:#526b7d">Eight bands: 24 actions</text>
<rect x="348" y="842" width="745" height="30" rx="0" fill="#fff"/>
<text x="721" y="864" font-size="17" font-weight="700" style="fill:#a74c63" text-anchor="middle">Receiver feedback updates history; model weights remain frozen</text>
