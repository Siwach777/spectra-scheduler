<text x="1286" y="256" font-size="23" fill="#173648" font-weight="700">Capture forecast</text>
<text x="1236" y="300" font-size="36" fill="#18796c" font-weight="700">80 ms</text>
<text x="1236" y="330" font-size="18" fill="#18796c">Next horizon × every band</text>
<text x="1236" y="376" font-size="19" fill="#173648">Expected capture counts</text>
<text x="1236" y="406" font-size="17" fill="#526c7c">Inferred from past observations</text>
<text x="1236" y="450" font-size="18" fill="#173648" font-weight="700">[batch, bands, 80]</text>
<text x="1236" y="480" font-size="17" fill="#526c7c">A prediction, not future truth</text>
<text x="1236" y="522" font-size="13" fill="#526c7c">Band-shared frozen parameters</text>
<text x="1236" y="601" font-size="17" fill="#a27320" font-weight="700">Forecast evaluation contract</text>
<text x="1236" y="629" font-size="16" fill="#526c7c">Synthetic action: probability,</text>
<text x="1236" y="653" font-size="16" fill="#526c7c">intercept delay and arrival ratio.</text>
<text x="1236" y="682" font-size="16" fill="#526c7c">Replay delivers actions; external</text>
<text x="1236" y="706" font-size="16" fill="#526c7c">forecast calibration is open.</text>
<text x="84" y="840" font-size="21" fill="#173648" font-weight="700">Public receiver state</text>
<text x="84" y="870" font-size="17" fill="#526c7c">Current band and retune delays</text>
<text x="84" y="894" font-size="17" fill="#526c7c">Remaining episode time</text>
<text x="84" y="918" font-size="17" fill="#526c7c">Observed ages for coverage</text>
<text x="84" y="984" font-size="12" fill="#526c7c">Receiver specification · causal state</text>
<text x="486" y="848" font-size="14" fill="#286987" font-weight="700" text-anchor="middle">04</text>
<text x="518" y="850" font-size="23" fill="#173648" font-weight="700">Frequency–time dynamic program</text>
<text x="468" y="882" font-size="19" fill="#173648">Integrate expected capture; retuning consumes forecast time</text>
<text x="468" y="911" font-size="18" fill="#173648">Clip dwell to remaining budget; execute only the first native action</text>
<text x="468" y="940" font-size="18" fill="#526c7c">Coverage: 512-ms revisit threshold and 10-ms probe</text>
<text x="468" y="984" font-size="13" fill="#526c7c">CalibratedTimingPlannerPolicy · timing_planner.py</text>
<text x="1236" y="840" font-size="21" fill="#b24965" font-weight="700">Execute first action</text>
<text x="1236" y="870" font-size="17" fill="#526c7c">Band + 1 / 10 / 50-ms dwell</text>
<text x="1236" y="894" font-size="17" fill="#526c7c">8 bands → 24 native actions</text>
<text x="1236" y="918" font-size="17" fill="#526c7c">Retune → listen → observe</text>
<text x="1236" y="984" font-size="12" fill="#526c7c">Passive receiver execution</text>
<text x="963" y="749" font-size="16" fill="#286987" text-anchor="middle">Predicted capture across the horizon</text>
<text x="804" y="1036" font-size="19" fill="#286987" font-weight="700" text-anchor="middle">New receiver observations update memory; model weights remain frozen.</text>
<text x="800" y="1103" font-size="17" fill="#526c7c" text-anchor="middle">Causal boundary: no emitter identities, supplied timing parameters, scenario identity or future truth.</text>
