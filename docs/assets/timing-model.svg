<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1132" viewBox="0 0 1600 1132" role="img" aria-labelledby="title desc">
<title id="title">Spectra Scheduler — causal forecaster and frequency–time planner</title>
<desc id="desc">Detailed model path from a three-channel 288-ms receiver history to a frozen band-shared causal temporal convolutional network, observation-only phase hypotheses for periods 2–144 ms, and an aperiodic rate expert. A learned mixture and rate correction produce 80-ms expected capture counts for every band. The dynamic program combines forecasts with public current band, retune delays, remaining time and observed ages. It executes the first of 24 native band/dwell actions. Retuning and listening occur before receiver feedback updates history. No actual emitter timing, identity or future truth is supplied to the model. Synthetic action forecasts have a separate evaluation contract; calibrated external replay timing forecasts are not established.</desc>
