<text x="64" y="63" font-size="36" fill="#173648" font-weight="700">Inside the timing scheduler</text>
<text x="64" y="98" font-size="20" fill="#526c7c">Causal observation history → temporal opportunity forecast → frequency–time control</text>
<text x="1420" y="57" font-size="15" fill="#18796c" font-weight="700" text-anchor="middle">Selected frozen model</text>
<text x="102" y="230" font-size="14" fill="#286987" font-weight="700" text-anchor="middle">01</text>
<text x="134" y="232" font-size="23" fill="#173648" font-weight="700">Causal memory</text>
<text x="228" y="289" font-size="32" fill="#286987" font-weight="700" text-anchor="middle">288 ms</text>
<text x="228" y="313" font-size="16" fill="#286987" text-anchor="middle">Past history for each band</text>
<text x="97" y="357" font-size="14" fill="#286987" font-weight="700" text-anchor="middle">1</text>
<text x="124" y="359" font-size="18" fill="#173648">Listening mask</text>
<text x="97" y="405" font-size="14" fill="#286987" font-weight="700" text-anchor="middle">2</text>
<text x="124" y="407" font-size="18" fill="#173648">Observed counts</text>
<text x="97" y="453" font-size="14" fill="#286987" font-weight="700" text-anchor="middle">3</text>
<text x="124" y="455" font-size="18" fill="#173648">Available measured power</text>
<text x="84" y="510" font-size="18" fill="#286987" font-weight="700">Unobserved remains masked</text>
<text x="84" y="540" font-size="17" fill="#526c7c">Retune ticks have no exposure</text>
<text x="84" y="590" font-size="17" fill="#526c7c">Replay preserves raw counts;</text>
<text x="84" y="617" font-size="17" fill="#526c7c">dataset dB is not receiver dBm.</text>
<text x="84" y="658" font-size="17" fill="#173648" font-weight="700">[batch, bands, 3, 288]</text>
<text x="84" y="690" font-size="13" fill="#526c7c">TimingHistory</text>
<text x="464" y="188" font-size="16" fill="#18796c" font-weight="700">02 · TimingBeliefNetwork · CUDA inference, shared band weights</text>
<text x="484" y="246" font-size="21" fill="#173648" font-weight="700">Prepare observations</text>
<text x="484" y="276" font-size="17" fill="#526c7c">Synthetic: learned power-quality weighting</text>
<text x="484" y="300" font-size="17" fill="#526c7c">Replay: raw counts; bypass missing calibrated-power gate</text>
<text x="484" y="322" font-size="12" fill="#526c7c">Explicit mask preserves censored observations</text>
<text x="484" y="406" font-size="21" fill="#173648" font-weight="700">Shared causal TCN</text>
<text x="484" y="436" font-size="17" fill="#526c7c">Width 32; left padding; kernel 3</text>
<text x="484" y="460" font-size="17" fill="#526c7c">Dilations: 1, 2, 4, 8, 16, 32, 64</text>
<text x="484" y="484" font-size="17" fill="#526c7c">Last / pooled context + exposure</text>
<text x="484" y="516" font-size="12" fill="#526c7c">Context from past evidence only</text>
<text x="836" y="406" font-size="21" fill="#173648" font-weight="700">Phase / rate evidence</text>
<text x="836" y="436" font-size="17" fill="#526c7c">Periods 2–144 ms: hypotheses</text>
<text x="836" y="460" font-size="17" fill="#526c7c">Phase hits / listening exposure</text>
<text x="836" y="484" font-size="17" fill="#526c7c">Aperiodic expert: observed rate</text>
<text x="836" y="516" font-size="12" fill="#526c7c">Actual period / phase never supplied</text>
<text x="484" y="610" font-size="21" fill="#18796c" font-weight="700">Learned mixture + rate correction</text>
<text x="484" y="640" font-size="17" fill="#526c7c">Context and phase evidence → expert weights → projected counts</text>
<text x="484" y="672" font-size="12" fill="#526c7c">No absolute band-ID embedding</text>
