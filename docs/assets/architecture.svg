<svg xmlns="http://www.w3.org/2000/svg" width="1424" height="1760" viewBox="0 0 1424 1760" role="img" aria-labelledby="title desc">
<title id="title">Spectra Scheduler — detailed system architecture</title><desc id="desc">Independent CLI and browser entry points use the Python core. Synthetic worlds and streamed synthetic TSRD stare PDWs feed separate passive receiver backends. Anonymous observations enter 288-ms causal memory, a band-shared temporal/phase-mixture forecaster, and an 80-ms band-and-dwell planner. Actions return to either receiver. Offline CUDA training produces frozen checkpoints. Simulator truth and recording labels flow only to evaluation and training targets. Optional runtime acceleration and alternative policy families are separate from the selected path. No live RF or SDR is connected.</desc>
<defs>
<marker id="data-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#2b6285" stroke-width="1.6"/></marker>
<marker id="action-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#a74c63" stroke-width="1.6"/></marker>
<marker id="truth-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#a07628" stroke-width="1.6"/></marker>
<marker id="weights-arrow" markerWidth="9" markerHeight="9" refX="8" refY="4.5" orient="auto"><path d="M1 1L8 4.5L1 8" fill="none" stroke="#277b69" stroke-width="1.6"/></marker>
<style>
text {font-family:'Noto Sans','Segoe UI',Arial,sans-serif;fill:#183246;}
