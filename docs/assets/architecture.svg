<text x="64" y="63" font-size="36" fill="#173648" font-weight="700">Spectra Scheduler</text>
<text x="64" y="98" font-size="20" fill="#526c7c">Implemented system architecture · passive frequency–time scheduling · frozen model at runtime</text>
<text x="1420" y="57" font-size="15" fill="#18796c" font-weight="700" text-anchor="middle">Passive / receive-only</text>
<text x="84" y="158" font-size="21" fill="#173648" font-weight="700">CLI · simulation and PDW replay</text>
<text x="84" y="188" font-size="17" fill="#526c7c">Configure receiver, checkpoint and matched comparisons</text>
<text x="84" y="206" font-size="12" fill="#526c7c">cli.py / timing_cli.py · replay_cli.py</text>
<text x="844" y="158" font-size="21" fill="#173648" font-weight="700">Browser · comparisons and playback</text>
<text x="844" y="188" font-size="17" fill="#526c7c">Request matched synthetic runs; inspect metrics and traces</text>
<text x="844" y="206" font-size="12" fill="#526c7c">web/server.py → web/api.py → web/timing_backend.py</text>
<text x="800" y="242" font-size="15" fill="#526c7c" text-anchor="middle">Both interfaces invoke the Python core; the browser plays completed synthetic traces.</text>
<text x="64" y="286" font-size="16" fill="#526c7c" font-weight="700">OFFLINE LEARNING · targets stay here; runtime does not train</text>
<text x="84" y="340" font-size="21" fill="#173648" font-weight="700">Collect causal states</text>
<text x="84" y="370" font-size="17" fill="#526c7c">Pre-action histories + future targets</text>
<text x="84" y="394" font-size="17" fill="#526c7c">Bounded samples; streamed caches</text>
<text x="84" y="420" font-size="12" fill="#526c7c">timing_study · PDW collector</text>
<text x="468" y="340" font-size="21" fill="#173648" font-weight="700">Optimize on CUDA</text>
<text x="468" y="370" font-size="17" fill="#526c7c">Forecast loss + state refinement</text>
<text x="468" y="394" font-size="17" fill="#526c7c">Batch 256; staged GPU transfers</text>
<text x="468" y="420" font-size="12" fill="#526c7c">timing_refine / timing_pdw_refine</text>
<text x="852" y="340" font-size="21" fill="#173648" font-weight="700">Select on development</text>
<text x="852" y="370" font-size="17" fill="#526c7c">Capture and discovery checks</text>
<text x="852" y="394" font-size="17" fill="#526c7c">Separate selection inputs</text>
<text x="852" y="420" font-size="12" fill="#526c7c">planner_study · selection reports</text>
<text x="1236" y="340" font-size="21" fill="#18796c" font-weight="700">Freeze deployment bundle</text>
<text x="1236" y="370" font-size="17" fill="#526c7c">Selected epoch-24 forecaster</text>
<text x="1236" y="394" font-size="17" fill="#526c7c">Weights + policy settings + hashes</text>
<text x="1236" y="420" font-size="12" fill="#526c7c">PDW fine-tune remains unselected</text>
<text x="1188" y="479" font-size="16" fill="#18796c" font-weight="700" text-anchor="middle">Frozen model checkpoint</text>
<text x="64" y="554" font-size="16" fill="#18796c" font-weight="700">ONLINE RECEIVER LOOP · only past observations and public receiver state</text>
<text x="102" y="618" font-size="14" fill="#286987" font-weight="700" text-anchor="middle">01</text>
<text x="134" y="620" font-size="23" fill="#173648" font-weight="700">Passive receiver</text>
<text x="100" y="670" font-size="19" fill="#173648" font-weight="700">Synthetic RF worlds</text>
<text x="100" y="693" font-size="16" fill="#526c7c">Agile / spatial / periodic arrivals</text>
<text x="100" y="714" font-size="15" fill="#526c7c">Noise, sensitivity and false alarms</text>
<text x="100" y="766" font-size="19" fill="#173648" font-weight="700">TSRD stare replay</text>
<text x="100" y="789" font-size="16" fill="#526c7c">Stream PDWs; bandpass + dwell</text>
<text x="100" y="810" font-size="14" fill="#526c7c">Retune delays; whole-pulse windows</text>
<text x="84" y="846" font-size="12" fill="#526c7c">receiver.py · pulse_replay.py · replay_env.py</text>
<text x="486" y="618" font-size="14" fill="#286987" font-weight="700" text-anchor="middle">02</text>
<text x="518" y="620" font-size="23" fill="#173648" font-weight="700">Causal memory</text>
<text x="468" y="650" font-size="20" fill="#173648" font-weight="700">Listening mask</text>
<text x="468" y="676" font-size="20" fill="#173648" font-weight="700">Detection counts</text>
<text x="468" y="702" font-size="17" fill="#173648">Measured power when available</text>
<text x="468" y="740" font-size="18" fill="#286987" font-weight="700">Unobserved ≠ empty</text>
<text x="468" y="765" font-size="16" fill="#526c7c">Replay: raw counts; no power gate</text>
<text x="612" y="811" font-size="20" fill="#286987" font-weight="700" text-anchor="middle">288 ms × every band</text>
<text x="468" y="846" font-size="12" fill="#526c7c">TimingHistory · record_pdw_history</text>
<text x="870" y="618" font-size="14" fill="#18796c" font-weight="700" text-anchor="middle">03</text>
<text x="902" y="620" font-size="23" fill="#173648" font-weight="700">Timing forecaster</text>
<text x="852" y="650" font-size="19" fill="#173648">Band-shared causal TCN</text>
<text x="852" y="677" font-size="19" fill="#173648">Learned phase / rate mixture</text>
<text x="852" y="704" font-size="18" fill="#173648">Periods 2–144 ms: hypotheses</text>
<text x="852" y="733" font-size="16" fill="#526c7c">Past evidence → future opportunity</text>
<text x="996" y="783" font-size="23" fill="#18796c" font-weight="700" text-anchor="middle">80 ms × all bands</text>
<text x="996" y="809" font-size="16" fill="#18796c" text-anchor="middle">Expected capture counts</text>
<text x="852" y="846" font-size="12" fill="#526c7c">TimingBeliefNetwork · timing_belief.py</text>
<text x="1254" y="618" font-size="14" fill="#286987" font-weight="700" text-anchor="middle">04</text>
<text x="1286" y="620" font-size="23" fill="#173648" font-weight="700">Band + dwell</text>
<text x="1236" y="650" font-size="17" fill="#173648" font-weight="700">Retune-aware dynamic program</text>
<text x="1236" y="677" font-size="18" fill="#173648">Public band, delays and time left</text>
<text x="1236" y="704" font-size="18" fill="#173648">1 / 10 / 50-ms listening dwell</text>
<text x="1236" y="731" font-size="18" fill="#286987" font-weight="700">8 bands → 24 native actions</text>
<text x="1236" y="770" font-size="18" fill="#526c7c">Coverage: 512-ms revisit</text>
<text x="1236" y="797" font-size="17" fill="#526c7c">10-ms probe; execute first action</text>
<text x="1236" y="846" font-size="12" fill="#526c7c">timing_planner.py · timing_replay.py</text>
<text x="804" y="903" font-size="20" fill="#b24965" font-weight="700" text-anchor="middle">band + listening dwell · retune → listen → observe → replan</text>
<text x="800" y="950" font-size="17" fill="#526c7c" text-anchor="middle">Policy inputs exclude emitter identity, actual period / phase, scenario identity and future truth.</text>
<text x="64" y="1038" font-size="16" fill="#a27320" font-weight="700">PAIRED EVALUATION · truth is joined after the decision</text>
<text x="84" y="1094" font-size="21" fill="#173648" font-weight="700">Evaluator-only truth</text>
<text x="84" y="1124" font-size="17" fill="#526c7c">Source arrivals and file-local emitter labels</text>
<text x="84" y="1148" font-size="17" fill="#526c7c">Captures, misses and discovery references</text>
<text x="84" y="1174" font-size="12" fill="#526c7c">TruthOutcome · recording evaluation records</text>
<text x="600" y="1094" font-size="21" fill="#173648" font-weight="700">Score paired runs</text>
<text x="600" y="1124" font-size="17" fill="#526c7c">Capture, discovery, prediction and time costs</text>
<text x="600" y="1148" font-size="17" fill="#526c7c">Identical receiver, seeds and physical time</text>
<text x="600" y="1174" font-size="12" fill="#526c7c">evaluation_contract.py · synthetic / replay scoring</text>
<text x="1116" y="1094" font-size="21" fill="#173648" font-weight="700">Matched benchmark reports</text>
<text x="1116" y="1124" font-size="17" fill="#526c7c">Sweep / UCB / Thompson / Whittle / phase / MPC</text>
<text x="1116" y="1148" font-size="17" fill="#526c7c">Paired intervals, JSON/CSV and provenance</text>
<text x="1116" y="1174" font-size="12" fill="#526c7c">policy_benchmark.py · reports.py</text>
<text x="1132" y="982" font-size="15" fill="#286987" text-anchor="middle">Pre-action forecasts + executed windows</text>
<text x="108" y="1246" font-size="16" fill="#526c7c">Observations / forecasts</text>
<text x="508" y="1246" font-size="16" fill="#526c7c">Receiver commands</text>
<text x="876" y="1246" font-size="16" fill="#526c7c">Truth / labels only</text>
<text x="1244" y="1246" font-size="16" fill="#526c7c">Frozen weights</text>
<text x="64" y="1284" font-size="17" fill="#526c7c">Optional execution: native C++ planner + CUDA graph inference. Alternative policies share evaluation, not the forecaster pipeline.</text>
<text x="64" y="1315" font-size="16" fill="#526c7c">TSRD replay is external synthetic data; no connected SDR or real RF validation. Replay timing forecasts are not externally calibrated.</text>
</svg>
