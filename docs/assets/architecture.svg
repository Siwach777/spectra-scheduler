.action {fill:none;stroke:#a74c63;stroke-width:2.4;marker-end:url(#action-arrow);}
.truth {fill:none;stroke:#a07628;stroke-width:2.2;stroke-dasharray:6 5;marker-end:url(#truth-arrow);}
.weights {fill:none;stroke:#277b69;stroke-width:2.2;stroke-dasharray:9 4;marker-end:url(#weights-arrow);}
</style></defs>
<rect x="0" y="0" width="1424" height="1760" rx="0" fill="#ffffff"/>
<text x="40" y="53" font-size="32" font-weight="700" style="fill:#183246">Spectra Scheduler</text>
<text x="40" y="87" font-size="18" style="fill:#526b7d">Detailed implemented architecture · passive, receive-only · frozen model at runtime</text>
<rect x="1200" y="35" width="184" height="36" rx="12" fill="#e9f4ef"/>
<text x="1292" y="59" font-size="15" font-weight="700" style="fill:#277b69" text-anchor="middle">Software prototype</text>
<rect x="40" y="120" width="1344" height="148" rx="12" fill="#f3f6f9" stroke="#d9e2e9" stroke-width="1.3"/>
<text x="64" y="153" font-size="15" font-weight="700" style="fill:#526b7d">ENTRY POINTS</text>
<rect x="64" y="170" width="628" height="74" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="82" y="202" font-size="20" font-weight="700" style="fill:#183246">CLI: simulation and external replay</text>
<text x="82" y="227" font-size="13" style="fill:#526b7d">cli.py / timing_cli.py · replay_cli.py</text>
<rect x="716" y="170" width="644" height="74" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="734" y="202" font-size="20" font-weight="700" style="fill:#183246">Browser: synthetic comparisons and playback</text>
<text x="734" y="227" font-size="13" style="fill:#526b7d">web/server.py → web/api.py → web/timing_backend.py</text>
<rect x="433" y="273" width="582" height="25" rx="3" fill="#fff"/>
<text x="724" y="291" font-size="14" style="fill:#526b7d" text-anchor="middle">Entry points invoke the core; GUI is not a core dependency</text>
<rect x="40" y="320" width="352" height="780" rx="12" fill="#f3f6f9" stroke="#d9e2e9" stroke-width="1.3"/>
<text x="64" y="348" font-size="15" font-weight="700" style="fill:#526b7d">RECEIVER BACKENDS</text>
<rect x="64" y="365" width="304" height="128" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="82" y="397" font-size="21" font-weight="700" style="fill:#183246">Synthetic RF worlds</text>
<text x="82" y="427" font-size="17" style="fill:#526b7d">Agile / spatial / periodic</text>
<text x="82" y="451" font-size="17" style="fill:#526b7d">Seeded arrivals and RF strength</text>
<text x="82" y="476" font-size="13" style="fill:#526b7d">scenarios.py · emitters.py</text>
<rect x="64" y="535" width="304" height="128" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="82" y="567" font-size="20" font-weight="700" style="fill:#183246">Synthetic receiver</text>
<text x="82" y="597" font-size="17" style="fill:#526b7d">Sensitivity, noise, false alarms</text>
<text x="82" y="621" font-size="17" style="fill:#526b7d">Missed detections and retuning</text>
<text x="82" y="646" font-size="13" style="fill:#526b7d">simulation.py · receiver.py</text>
<rect x="64" y="730" width="304" height="128" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="82" y="762" font-size="19" font-weight="700" style="fill:#183246">Full-spectrum TSRD PDWs</text>
<text x="82" y="792" font-size="17" style="fill:#526b7d">Completed synthetic stare files</text>
<text x="82" y="816" font-size="17" style="fill:#526b7d">HDF5 chunks; labels kept apart</text>
<text x="82" y="841" font-size="13" style="fill:#526b7d">dataset_io.py</text>
<rect x="64" y="900" width="304" height="140" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="82" y="932" font-size="20" font-weight="700" style="fill:#183246">Physical-time replay</text>
<text x="82" y="962" font-size="17" style="fill:#526b7d">Bandpass + dwell + retune</text>
<text x="82" y="981" font-size="17" style="fill:#526b7d">Bounded delivered pulse buffer</text>
<text x="82" y="1000" font-size="17" style="fill:#526b7d">Whole-pulse window boundaries</text>
<text x="82" y="1023" font-size="13" style="fill:#526b7d">pulse_replay.py · replay_env.py</text>
<text x="65" y="710" font-size="15" font-weight="700" style="fill:#2b6285">Anonymous receiver feedback only</text>
<rect x="432" y="320" width="584" height="780" rx="12" fill="#f2f8f5" stroke="#bdd7cd" stroke-width="1.3"/>
<text x="456" y="348" font-size="15" font-weight="700" style="fill:#277b69">SELECTED CAUSAL SCHEDULER</text>
<rect x="456" y="365" width="536" height="156" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="474" y="397" font-size="21" font-weight="700" style="fill:#183246">1 · Causal receiver memory</text>
<text x="474" y="427" font-size="17" style="fill:#526b7d">288 ms / band: listening mask, counts, available power</text>
<text x="474" y="451" font-size="17" style="fill:#526b7d">Unobserved bands stay unknown; retuning is masked</text>
<text x="474" y="475" font-size="17" style="fill:#526b7d">PDW adapter: raw counts, calibrated power unavailable</text>
<text x="474" y="504" font-size="13" style="fill:#526b7d">TimingHistory · timing_replay.record_pdw_history</text>
<rect x="456" y="558" width="536" height="174" rx="12" fill="#e7f3ed" stroke="#92baa9" stroke-width="1.3"/>
<text x="474" y="590" font-size="21" font-weight="700" style="fill:#183246">2 · Temporal opportunity predictor</text>
<text x="474" y="620" font-size="17" style="fill:#526b7d">Shared TCN + learned periodic / aperiodic mixture</text>
<text x="474" y="644" font-size="17" style="fill:#526b7d">Candidate periods: 2–144 ms; no supplied emitter period</text>
<text x="474" y="668" font-size="17" style="fill:#526b7d">Output: expected capture counts, all bands × next 80 ms</text>
<text x="474" y="692" font-size="17" style="fill:#526b7d">Frozen checkpoint loaded on CUDA</text>
<text x="474" y="715" font-size="13" style="fill:#526b7d">TimingBeliefNetwork · timing_belief.py</text>
<rect x="456" y="768" width="536" height="164" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="474" y="800" font-size="21" font-weight="700" style="fill:#183246">3 · Frequency–time planner</text>
<text x="474" y="830" font-size="17" style="fill:#526b7d">Dynamic program integrates capture over the horizon</text>
<text x="474" y="851" font-size="17" style="fill:#526b7d">Public current band, retune table and episode time</text>
<text x="474" y="872" font-size="17" style="fill:#526b7d">Eight bands × 1 / 10 / 50-ms dwell = 24 native actions</text>
<text x="474" y="893" font-size="17" style="fill:#526b7d">Age-based coverage: revisit 512 ms; probe 10 ms</text>
<text x="474" y="915" font-size="13" style="fill:#526b7d">CalibratedTimingPlannerPolicy · timing_planner.py</text>
<rect x="456" y="968" width="536" height="100" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="474" y="1000" font-size="21" font-weight="700" style="fill:#183246">4 · Execute first action; then replan</text>
<text x="474" y="1030" font-size="17" style="fill:#526b7d">band + listening dwell → receiver → new observation</text>
<text x="474" y="1051" font-size="13" style="fill:#526b7d">SyntheticAction / indexed replay action</text>
<rect x="1040" y="320" width="344" height="780" rx="12" fill="#f3f6f9" stroke="#d9e2e9" stroke-width="1.3"/>
<text x="1064" y="348" font-size="15" font-weight="700" style="fill:#526b7d">OFFLINE MODEL LIFECYCLE</text>
<rect x="1064" y="365" width="296" height="160" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="1082" y="397" font-size="20" font-weight="700" style="fill:#183246">Causal state collection</text>
<text x="1082" y="427" font-size="17" style="fill:#526b7d">Pre-action histories from</text>
<text x="1082" y="446" font-size="17" style="fill:#526b7d">training worlds / recordings</text>
<text x="1082" y="465" font-size="17" style="fill:#526b7d">Future truth: targets only</text>
<text x="1082" y="484" font-size="17" style="fill:#526b7d">Bounded samples and caches</text>
<text x="1082" y="508" font-size="13" style="fill:#526b7d">timing_study · PDW collector</text>
<rect x="1064" y="576" width="296" height="150" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="1082" y="608" font-size="20" font-weight="700" style="fill:#183246">CUDA optimization</text>
<text x="1082" y="638" font-size="17" style="fill:#526b7d">Temporal forecast losses</text>
<text x="1082" y="662" font-size="17" style="fill:#526b7d">Planner-state refinement</text>
<text x="1082" y="686" font-size="17" style="fill:#526b7d">Batch 256; staged GPU inputs</text>
<text x="1082" y="709" font-size="13" style="fill:#526b7d">timing_refine / timing_pdw_refine</text>
<rect x="1064" y="778" width="296" height="126" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="1082" y="810" font-size="19" font-weight="700" style="fill:#183246">Development selection</text>
<text x="1082" y="840" font-size="17" style="fill:#526b7d">Capture + discovery checks</text>
<text x="1082" y="864" font-size="17" style="fill:#526b7d">Separate selection inputs</text>
<text x="1082" y="887" font-size="13" style="fill:#526b7d">planner_study · selection reports</text>
<rect x="1064" y="946" width="296" height="126" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="1082" y="978" font-size="20" font-weight="700" style="fill:#183246">Frozen checkpoint</text>
<text x="1082" y="1008" font-size="17" style="fill:#526b7d">Selected: epoch-24 forecaster</text>
<text x="1082" y="1032" font-size="17" style="fill:#526b7d">New PDW weights unselected</text>
<text x="1082" y="1055" font-size="13" style="fill:#526b7d">weights + policy settings + hashes</text>
<rect x="440" y="1123" width="894" height="48" rx="0" fill="#fff"/>
<text x="455" y="1144" font-size="18" font-weight="700" style="fill:#a74c63">CONTROL LOOP: listen after retuning → ingest feedback → predict → plan again</text>
<text x="455" y="1168" font-size="16" style="fill:#526b7d">No emitter IDs, actual period / phase, scenario identity or future truth in policy inputs.</text>
<text x="684" y="1213" font-size="15" style="fill:#2b6285">Pre-action forecasts + executed windows</text>
<rect x="40" y="1236" width="1344" height="238" rx="12" fill="#faf7ef" stroke="#e1d5b9" stroke-width="1.3"/>
<text x="64" y="1271" font-size="15" font-weight="700" style="fill:#a07628">PAIRED EVALUATION — NOT POLICY INPUT</text>
<rect x="64" y="1283" width="414" height="121" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="82" y="1315" font-size="20" font-weight="700" style="fill:#183246">Evaluator-only truth</text>
<text x="82" y="1345" font-size="17" style="fill:#526b7d">Simulated arrivals / recording labels</text>
<text x="82" y="1365" font-size="17" style="fill:#526b7d">True captures, missed events, discovery</text>
<text x="82" y="1387" font-size="13" style="fill:#526b7d">TruthOutcome · receiver evaluation records</text>
<rect x="506" y="1283" width="414" height="121" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="524" y="1315" font-size="20" font-weight="700" style="fill:#183246">Outcome and forecast scoring</text>
<text x="524" y="1345" font-size="17" style="fill:#526b7d">Capture / discovery / physical-time cost</text>
<text x="524" y="1365" font-size="17" style="fill:#526b7d">Prediction error, censoring and coverage</text>
<text x="524" y="1387" font-size="13" style="fill:#526b7d">evaluation_contract.py · synthetic_evaluation.py</text>
<rect x="948" y="1283" width="412" height="121" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="966" y="1315" font-size="20" font-weight="700" style="fill:#183246">Matched benchmark reports</text>
<text x="966" y="1345" font-size="17" style="fill:#526b7d">Same worlds / files, seeds and time</text>
<text x="966" y="1365" font-size="17" style="fill:#526b7d">Frozen controls; paired bootstrap intervals</text>
<text x="966" y="1387" font-size="13" style="fill:#526b7d">policy_benchmark.py · reports.py</text>
<text x="64" y="1443" font-size="16" style="fill:#526b7d">Unavailable metrics are null. Replay has no false-alarm model or calibrated external timing forecasts.</text>
<rect x="40" y="1510" width="650" height="140" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="58" y="1542" font-size="21" font-weight="700" style="fill:#183246">Optional execution acceleration</text>
<text x="58" y="1572" font-size="17" style="fill:#526b7d">Native C++ dynamic program + captured CUDA model launches</text>
<text x="58" y="1591" font-size="17" style="fill:#526b7d">Measured warmed serial p99: 0.464–0.532 ms on development GPU</text>
<text x="58" y="1610" font-size="17" style="fill:#526b7d">Loading, warmup, receiver I/O and GUI serialization excluded</text>
<text x="58" y="1633" font-size="13" style="fill:#526b7d">planner_native.py · _planner.cpp · timing_runtime.py</text>
<rect x="718" y="1510" width="666" height="140" rx="12" fill="#fff" stroke="#cbd8e2" stroke-width="1.3"/>
<text x="736" y="1542" font-size="21" font-weight="700" style="fill:#183246">Alternative policies and experiments</text>
<text x="736" y="1572" font-size="17" style="fill:#526b7d">Controls: sweep, UCB, Thompson, Whittle, golden, phase planner</text>
<text x="736" y="1591" font-size="17" style="fill:#526b7d">Learning branches: hit models, DQN, PPO, trajectory RL, Neural-MPC</text>
<text x="736" y="1610" font-size="17" style="fill:#526b7d">These share evaluation; they are not stages of the selected model</text>
<text x="736" y="1633" font-size="13" style="fill:#526b7d">schedulers.py · adaptive_scan.py · mpc/ · experiments/</text>
<text x="85" y="1696" font-size="15" style="fill:#526b7d">Observations / forecasts</text>
<text x="385" y="1696" font-size="15" style="fill:#526b7d">Receiver actions</text>
<text x="650" y="1696" font-size="15" style="fill:#526b7d">Truth / labels only</text>
<text x="934" y="1696" font-size="15" style="fill:#526b7d">Frozen weights</text>
<text x="40" y="1735" font-size="16" style="fill:#526b7d">External replay uses synthetic TSRD PDWs. Browser playback is synthetic. No connected SDR or real RF validation.</text>
