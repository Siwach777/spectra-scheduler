<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1136" viewBox="0 0 1440 1136" role="img" aria-labelledby="title desc">
  <title id="title">Spectra Scheduler architecture</title>
  <desc id="desc">The independent CLI and browser interface invoke the Python core. Synthetic emitter scenarios feed a passive receiver. Receiver observations form causal history for a trained timing forecaster and receding-horizon planner, which returns band and dwell actions to the receiver. Hidden simulator truth is separate and used for evaluation. CUDA training creates local checkpoints offline. TSRD pulse ingestion, association and physical-time replay are separate workflows.</desc>
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8" fill="none" stroke="#526477" stroke-width="1.4"/></marker>
    <marker id="truth-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0 0 8 4 0 8" fill="none" stroke="#a16f2d" stroke-width="1.4"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #233143; }
      .title { font-size: 30px; font-weight: 650; }
      .section { font-size: 20px; font-weight: 600; }
      .heading { font-size: 19px; font-weight: 600; }
      .body { font-size: 17px; }
      .small { font-size: 15px; fill: #607084; }
      .code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: 14px; fill: #607084; }
      .lane { fill: #f6f8fa; stroke: #d9e1e8; stroke-width: 1.2; }
      .card { fill: #fff; stroke: #cbd6df; stroke-width: 1.2; }
      .flow { fill: none; stroke: #526477; stroke-width: 2; marker-end: url(#arrow); }
      .truth { fill: none; stroke: #a16f2d; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#truth-arrow); }
    </style>
  </defs>
  <rect width="1440" height="1136" fill="#fff"/>
  <text x="40" y="53" class="title">Spectra Scheduler</text>
  <text x="40" y="84" class="body" fill="#607084">Passive receiver scheduling · implemented architecture</text>
  <rect x="1168" y="32" width="232" height="40" rx="20" fill="#eaf4f1"/>
  <circle cx="1191" cy="52" r="4" fill="#236b61"/>
  <text x="1206" y="58" class="body" style="fill:#236b61">Receive-only prototype</text>

  <rect x="40" y="122" width="1360" height="158" rx="12" class="lane"/>
  <text x="64" y="154" class="section">Independent entry points</text>
  <rect x="64" y="172" width="612" height="78" rx="8" class="card"/>
  <text x="84" y="202" class="heading">Command-line interface</text>
  <text x="84" y="228" class="small">Paired experiments and JSON / CSV reports</text>
  <text x="452" y="203" class="code">spectra_scheduler.cli</text>
  <rect x="704" y="172" width="672" height="78" rx="8" class="card"/>
  <text x="724" y="202" class="heading">Browser interface</text>
  <text x="724" y="228" class="small">Playback, measured results and JSON export</text>
  <text x="1096" y="203" class="code">HTTP + web adapter</text>
  <text x="64" y="270" class="small">Both invoke the Python core. The CLI, core and training workflows do not depend on the GUI.</text>

  <rect x="40" y="310" width="1360" height="478" rx="12" class="lane"/>
  <text x="64" y="346" class="section">Synthetic runtime</text>
  <text x="64" y="372" class="small">Selected timing path shown below; baseline and experimental policies share the receiver interface.</text>

  <rect x="64" y="398" width="272" height="146" rx="8" class="card"/>
  <text x="84" y="430" class="heading">RF scenarios</text>
  <text x="84" y="462" class="body">Frequency-agile</text>
  <text x="84" y="487" class="body">Spatial / periodic scanning</text>
  <text x="84" y="522" class="code">scenarios.py · emitters.py</text>

  <rect x="376" y="398" width="272" height="146" rx="8" class="card"/>
  <text x="396" y="430" class="heading">Passive receiver</text>
  <text x="396" y="462" class="body">One observed band at a time</text>
  <text x="396" y="487" class="body">Sensitivity, noise, retuning</text>
  <text x="396" y="522" class="code">receiver.py · simulation.py</text>

  <rect x="688" y="398" width="272" height="146" rx="8" class="card"/>
  <text x="708" y="430" class="heading">Causal history</text>
  <text x="708" y="462" class="body">Listen mask, hits and misses</text>
  <text x="708" y="487" class="body">Measured power over time</text>
  <text x="708" y="522" class="code">TimingHistory</text>

  <rect x="1000" y="398" width="376" height="146" rx="8" fill="#eef6f3" stroke="#90b8ac" stroke-width="1.2"/>
  <text x="1020" y="430" class="heading" style="fill:#236b61">Trained timing scheduler</text>
  <text x="1020" y="462" class="body">Learned temporal forecasts on CUDA</text>
  <text x="1020" y="487" class="body">Receding-horizon plan + coverage probes</text>
  <text x="1020" y="522" class="code">timing_belief.py · timing_planner.py</text>

  <path d="M336 470H374" class="flow"/>
  <path d="M648 470H686" class="flow"/>
  <path d="M960 470H998" class="flow"/>
  <path d="M1188 544V590H512V546" class="flow"/>
  <rect x="706" y="574" width="305" height="30" rx="5" fill="#f6f8fa"/>
  <text x="858" y="595" text-anchor="middle" class="body">Next action: band + listening dwell</text>

  <path d="M200 544V642" class="truth"/>
  <text x="214" y="623" class="small" style="fill:#a16f2d">Hidden truth → evaluation only</text>
  <rect x="64" y="644" width="1312" height="106" rx="8" class="card"/>
  <text x="84" y="675" class="heading">Paired evaluation and reports</text>
  <text x="84" y="704" class="body">Actual receiver outcomes + pre-action forecasts + shared scenario truth</text>
  <text x="84" y="730" class="small">Capture, discovery, detection / false alarms, reward and intercept-time prediction error</text>
  <text x="1002" y="678" class="code">metrics.py</text>
  <text x="1002" y="703" class="code">evaluation_contract.py · reports.py</text>
  <text x="64" y="776" class="small">Scheduling uses receiver observations and public timing settings; it never receives future truth or emitter identities.</text>

  <rect x="40" y="818" width="1360" height="246" rx="12" class="lane"/>
  <text x="64" y="854" class="section">Offline workflows</text>
  <rect x="64" y="874" width="644" height="166" rx="8" class="card"/>
  <text x="84" y="905" class="heading">Model training and checkpoint selection</text>
  <text x="84" y="936" class="body">Observed histories + training targets → CUDA training</text>
  <text x="84" y="962" class="body">Held-out validation → selected local checkpoint</text>
  <text x="84" y="994" class="small">The runtime loads frozen weights; the GUI performs no training.</text>
  <text x="84" y="1022" class="code">experiments/ · timing_belief.py · artifacts/</text>
  <rect x="732" y="874" width="644" height="166" rx="8" class="card"/>
  <text x="752" y="905" class="heading">Recorded pulse data</text>
  <text x="752" y="936" class="body">TSRD HDF5 → streamed ingestion and validation</text>
  <text x="752" y="962" class="body">Offline association or physical-time receiver replay</text>
  <text x="752" y="994" class="small">A separate data path; recordings do not feed browser playback.</text>
  <text x="752" y="1022" class="code">dataset_io.py · dataset_evaluation.py · pulse_replay.py</text>

  <path d="M42 1099H75" class="flow"/>
  <text x="89" y="1105" class="small">Receiver data / actions</text>
  <path d="M318 1099H352" class="truth"/>
  <text x="366" y="1105" class="small">Evaluator-only truth</text>
  <text x="1400" y="1105" text-anchor="end" class="small">Other policy families: statistical baselines · DQN / recurrent RL · Neural-MPC</text>
</svg>
