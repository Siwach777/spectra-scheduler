<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" role="img" aria-labelledby="title desc">
<title id="title">Spectra Scheduler — implemented system architecture</title>
<desc id="desc">Landscape system diagram with independent CLI and browser entry points, an offline CUDA learning lane, and a four-stage passive receiver loop: receiver, 288-ms causal memory, temporal forecaster and band/dwell planner. Synthetic RF worlds and synthetic TSRD stare replay provide separate receiver backends. The shared causal TCN and learned phase/rate mixture forecast 80 ms over all bands. The retune-aware planner selects from 24 native band/dwell actions and replans after observations. Frozen weights enter the forecaster; truth and recording labels reach only offline targets and paired evaluation. No emitter identities, actual timing parameters or future truth enter the runtime policy. No SDR or real RF validation is shown.</desc>
