[build-system]
requires = ["hatchling>=1.25,<2"]
build-backend = "hatchling.build"

[project]
name = "spectra-scheduler"
version = "0.1.0"
description = "Simulation and evaluation platform for adaptive spectrum scanning"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.1,<3",
]

[project.scripts]
spectra-scheduler = "spectra_scheduler.cli:main"
spectra-dataset = "spectra_scheduler.dataset_cli:main"
spectra-learn = "spectra_scheduler.learning_cli:main"
spectra-rl = "spectra_scheduler.rl_cli:main"

[project.optional-dependencies]
learning = ["scikit-learn>=1.5,<2"]
dataset = [
  "h5py>=3.11,<4",
  "scikit-learn>=1.5,<2",
]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/spectra_scheduler"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
